<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minor Awards Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f7dc94;
    --muted: #e2bd6f;
    --gold: #e6b95c;
    --gold-bright: #ffeab0;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: transparent;
    width: 1920px; height: 1080px;
    overflow: hidden;
    font-family: var(--sans);
  }

  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end; /* Pin to bottom of screen */
    justify-content: center;
    padding: 70px 100px;
    pointer-events: none;
  }

  /* Bottom Lower-Third Layout Container (No Background, Perfectly Centered) */
  .award-overlay-container {
    display: flex;
    align-items: center; /* Vertically aligns award title and candidate info perfectly in the middle relative to each other */
    justify-content: center;
    gap: 60px; /* Space between award name and candidate name */
    width: 100%;
    max-width: 1600px;
    padding: 0 20px;
    background: transparent;
    border: none;
    box-shadow: none;
    text-shadow:
      0 0 2px rgba(0, 0, 0, 0.95),
      0 1px 3px rgba(0, 0, 0, 0.9),
      0 2px 10px rgba(0, 0, 0, 0.75);
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  #stage.show .award-overlay-container {
    opacity: 1;
    transform: none;
  }

  /* Left Side: Award Name */
  .award-box {
    text-align: right; /* Aligned towards the center gap */
    animation: slideRight 0.8s ease-out 0.2s both;
  }

  .award-title {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 2.4vw, 2.4rem);
    font-weight: 500;
    font-style: italic;
    color: var(--muted);
    margin: 0;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Right Side: Candidate Name & Meta */
  .candidate-box {
    text-align: left; /* Aligned towards the center gap */
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: slideLeft 0.8s ease-out 0.4s both;
  }

  .winner-name {
    font-family: var(--serif);
    font-size: clamp(2.2rem, 3.8vw, 3.6rem);
    font-weight: 600;
    line-height: 1.1;
    margin: 0;
    color: var(--ink);
    white-space: nowrap;
  }

  .winner-meta {
    font-family: var(--sans);
    font-size: clamp(0.9rem, 1.4vw, 1.2rem);
    color: var(--gold-bright);
    margin-top: 6px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* All Winners Recap Grid Layout for Stream */
  .recap-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-height: 90vh;
    padding: 20px;
    opacity: 0;
    transform: scale(0.98);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #stage.show-all .recap-wrapper {
    opacity: 1;
    transform: none;
  }

  .recap-title {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 3.2vw, 3rem);
    color: var(--ink);
    font-style: italic;
    font-weight: 500;
    margin: 0 0 25px 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px 30px;
    width: 100%;
    max-width: 1600px;
    max-height: 75vh;
    overflow: hidden;
    padding: 10px;
  }

  .item {
    background: transparent;
    border: none;
    padding: 10px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  .item .a {
    color: var(--muted);
    font-style: italic;
    font-family: var(--serif);
    font-size: 1rem;
    margin-bottom: 4px;
  }

  .item .n {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.4rem;
    color: var(--ink);
  }

  .idle {
    color: rgba(247, 220, 148, 0.3);
    font-size: clamp(1.2rem, 2.2vw, 2rem);
    font-style: italic;
    font-family: var(--serif);
  }

  /* Animations */
  @keyframes slideRight {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes slideLeft {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .award-overlay-container, .recap-wrapper, .award-box, .candidate-box {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
  <div id="stage"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // Add ?preview to URL to test over a studio backdrop in your browser tab
  if (/[?&]preview/.test(location.search)) {
    document.body.style.background = 'linear-gradient(135deg, #141622, #08090e)';
  }

  const socket = io({ query: { role: 'display' } });
  const stage = document.getElementById('stage');
  let lastSig = '';

  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function render(data) {
    const sig = JSON.stringify(data);
    if (sig === lastSig) return;
    lastSig = sig;

    const d = data.display || {};
    const awards = data.awards || [];

    if (d.mode === 'award') {
      const a = awards.find(x => x.id === d.awardId);
      if (a && a.winner) {
        const w = a.winner;
        const metaParts = [w.number ? `#${esc(w.number)}` : '', w.barangay ? esc(w.barangay) : ''].filter(Boolean);
        const meta = metaParts.join(' &bull; ');

        stage.className = '';
        stage.innerHTML = `
          <div class="award-overlay-container">
            <!-- Left Side: Award Name -->
            <div class="award-box">
              <h2 class="award-title">${esc(a.name)}</h2>
            </div>
            <!-- Right Side: Candidate Name & Meta -->
            <div class="candidate-box">
              <h1 class="winner-name">${esc(w.name)}</h1>
              ${meta ? `<div class="winner-meta">${meta}</div>` : ''}
            </div>
          </div>
        `;
        setTimeout(() => stage.classList.add('show'), 50);
        return;
      }
    }

    if (d.mode === 'all') {
      const won = awards.filter(a => a.winner);
      stage.className = '';
      stage.innerHTML = `
        <div class="recap-wrapper">
          <h1 class="recap-title">Minor Award Winners</h1>
          <div class="grid">
            ${won.map(a => `
              <div class="item">
                <div class="a">${esc(a.name)}</div>
                <div class="n">${esc(a.winner.name)}</div>
              </div>
            `).join('')}
          </div>
          ${won.length ? '' : '<div class="idle" style="margin-top: 40px;">No winners selected yet</div>'}
        </div>
      `;
      setTimeout(() => stage.classList.add('show-all'), 50);
      return;
    }

    stage.className = '';
    stage.innerHTML = '<div class="idle">Minor Awards</div>';
  }

  async function load() {
    try { 
      render(await (await fetch('/api/minor-awards')).json()); 
    } catch (e) { 
      // Server offline fallback
    }
  }

  socket.on('minor-awards-updated', render);
  socket.on('connect', load);
  load();
  setInterval(load, 5000);
</script>
</body>
</html>
