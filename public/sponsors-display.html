<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsors Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: radial-gradient(circle at center, #141622 0%, #08090e 100%);
    --gold: #f1c40f;
    --gold-glow: rgba(241, 196, 15, 0.5);
    --text-main: #f8f9fa;
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    box-sizing: border-box;
    position: relative;
    padding: 40px 20px;
  }

  /* Full Screen Background Media Layer */
  #bgContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    overflow: hidden;
  }

  #bgContainer img, #bgContainer video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Dark Overlay for readability */
  #bgOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.65); 
    z-index: 2;
  }

  .container {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 1200px;
    text-align: center;
  }

  /* Catchy Animated Pageant Title */
  h1 {
    font-family: 'Cinzel', serif;
    font-size: 3.8rem;
    font-weight: 800;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 6px;
    margin-top: 0;
    margin-bottom: 40px;
    text-shadow: 0 0 30px var(--gold-glow), 0 4px 15px rgba(0, 0, 0, 0.9);
    animation: titlePulse 3s ease-in-out infinite alternate;
  }

  @keyframes titlePulse {
    0% {
      transform: scale(1);
      text-shadow: 0 0 20px rgba(241, 196, 15, 0.4), 0 4px 15px rgba(0, 0, 0, 0.9);
    }
    100% {
      transform: scale(1.02);
      text-shadow: 0 0 40px rgba(241, 196, 15, 0.8), 0 4px 20px rgba(0, 0, 0, 0.9);
    }
  }

  /* 3 Columns x 2 Rows Grid Container */
  .sponsors-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 200px);
    gap: 25px;
    width: 100%;
  }

  /* Equal-sized Sponsor Cards */
  .sponsor-card {
    background: rgba(20, 22, 34, 0.65);
    border: 2px solid rgba(241, 196, 15, 0.3);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    transition: all 0.3s ease;
    overflow: position relative;
  }

  .sponsor-card:hover {
    border-color: var(--gold);
    box-shadow: 0 8px 30px rgba(241, 196, 15, 0.3);
    transform: translateY(-4px);
  }

  .sponsor-card p {
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    color: #cbd5e1;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
    opacity: 0.8;
  }

  /* Responsive adjustment for smaller screens */
  @media (max-width: 900px) {
    .sponsors-grid {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 180px);
    }
    h1 {
      font-size: 2.8rem;
    }
  }
</style>
</head>
<body>

<!-- Background Layer loaded with 2ND BG.mp4 from public/sponsors/ -->
<div id="bgContainer">
  <video src="/sponsors/2ND BG.mp4" autoplay muted loop playsinline></video>
</div>
<div id="bgOverlay"></div>

<div class="container">
  <h1>Thanks to our Sponsors</h1>
  
  <!-- 3x2 Grid Container (6 Equal Sponsor Cards) -->
  <div class="sponsors-grid">
    <div class="sponsor-card">
      <p>The image will display here</p>
    </div>
    <div class="sponsor-card">
      <p>The image will display here</p>
    </div>
    <div class="sponsor-card">
      <p>The image will display here</p>
    </div>
    <div class="sponsor-card">
      <p>The image will display here</p>
    </div>
    <div class="sponsor-card">
      <p>The image will display here</p>
    </div>
    <div class="sponsor-card">
      <p>The image will display here</p>
    </div>
  </div>
</div>

</body>
</html>
