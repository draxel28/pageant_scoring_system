<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pageant Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* All text is now gold. --ink is the primary (brightest) gold, --muted a slightly deeper gold. */
    --ink: #f7dc94;
    --muted: #e2bd6f;
    --gold: #e6b95c;
    --gold-bright: #ffeab0;
    --rose: #b1657a;
    --steel: #5b7ea3;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: transparent;
    width: 1920px; height: 1080px;
    overflow: hidden;
    font-family: var(--sans);
  }

  /* One slim slot per side, leaving the middle of the screen clear for the camera */
  .slot {
    position: absolute;
    top: 64px; bottom: 64px;
    width: 220px;
    display: flex;
    align-items: center;
    pointer-events: none;
  }
  .slot.female { left: 40px;  --accent: var(--rose); --from: -24px; --lead: 2.6s; }
  .slot.male   { right: 40px; --accent: var(--steel); --from: 24px; --lead: 6.6s; }

  /* The spine: a single vertical rule on the edge nearest the camera / center of frame */
  .panel {
    position: relative;
    width: 100%;
    padding: 0 22px;
    display: flex;
    flex-direction: column;
    /* Layered dark halo so gold text stays readable over bright or busy camera footage */
    text-shadow:
      0 0 2px rgba(0, 0, 0, 0.95),
      0 1px 3px rgba(0, 0, 0, 0.9),
      0 2px 10px rgba(0, 0, 0, 0.75);
    opacity: 0;
    transform: translateX(var(--from));
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .slot.show .panel { opacity: 1; transform: none; transition-delay: var(--lead); }

  .slot.female .panel {
    text-align: right;
    border-right: 1px solid;
    border-image: linear-gradient(180deg, transparent, var(--accent) 15%, var(--accent) 85%, transparent) 1;
  }
  .slot.male .panel {
    text-align: left;
    border-left: 1px solid;
    border-image: linear-gradient(180deg, transparent, var(--accent) 15%, var(--accent) 85%, transparent) 1;
  }

  /* Identity block */
  .portrait {
    width: 76px; height: 76px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--gold);
    box-shadow:
      0 0 0 3px rgba(0, 0, 0, 0.55),
      0 0 16px rgba(230, 185, 92, 0.45);
  }
  .slot.female .portrait { margin-left: auto; margin-right: 0; }
  .slot.male .portrait { margin-right: auto; margin-left: 0; }
  .portrait img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    /* keep photos in full, lively color; slight lift so faces pop against the video */
    filter: saturate(1.25) brightness(1.06) contrast(1.1);
  }
  .portrait-mark {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 22px;
    color: var(--gold);
    background: rgba(0, 0, 0, 0.2);
  }

  .id-mark {
    margin-top: 12px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--gold);
    letter-spacing: 0.03em;
  }
  .name {
    margin-top: 6px;
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 600;
    line-height: 1.08;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .meta { margin-top: 10px; }
  .hometown {
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .segment {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
    font-style: italic;
    font-family: var(--serif);
    font-weight: 600;
  }

  .divider {
    height: 1px;
    margin: 18px 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  /* Judges: quiet ledger rows */
  .judges { flex-shrink: 0; }
  .judge {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 7px 0;
  }
  .slot.male .judge { flex-direction: row; }
  .slot.female .judge { flex-direction: row-reverse; }

  .judge-name {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .judge-score {
    display: inline-block;
    font-family: var(--serif);
    font-style: italic;
    color: var(--ink);
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    transform-origin: center;
  }
  .judge-score.pending { color: rgba(247, 220, 148, 0.55); font-style: normal; font-weight: 400; }
  .judge-score.flash { animation: scoreIn 1.4s ease-out; }
  @keyframes scoreIn {
    0%   { color: #ffffff; transform: scale(1.3); }
    100% { color: var(--ink); transform: scale(1); }
  }

  /* The average: a ledger total, the one moment of scale */
  .avg {
    position: relative;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid var(--gold);
  }
  .avg-label {
    font-family: var(--serif);
    font-style: italic;
    font-variant: small-caps;
    letter-spacing: 0.02em;
    font-size: 15px;
    font-weight: 600;
    color: var(--gold);
  }
  .avg-score {
    margin-top: 2px;
    font-family: var(--serif);
    font-size: 48px;
    font-weight: 600;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
    background-image:
      linear-gradient(110deg, transparent 38%, rgba(255, 255, 255, 0.85) 50%, transparent 62%),
      linear-gradient(180deg, var(--gold-bright) 0%, #f0c96e 55%, #d4a24c 100%);
    background-size: 250% 100%, 100% 100%;
    background-repeat: no-repeat;
    background-position: 160% 0, 0 0;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.9)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.7));
  }

  /* ---------- Animation ----------
     Starts when the slot gets .show. Nothing appears for the first 3s; then the
     female panel plays and the male panel follows 1.6s later. Adjust --lead on
     .slot.female (start delay) and .slot.male (start delay + gap) at the top. */
  .slot.show .portrait {
    animation:
      portraitIn 1s cubic-bezier(0.2, 1.3, 0.4, 1) calc(var(--lead) + 0.2s) both,
      ringGlow 4.5s ease-in-out calc(var(--lead) + 1.2s) infinite;
  }
  .slot.show .id-mark { animation: slideIn 0.8s ease-out calc(var(--lead) + 0.5s) both; }
  .slot.show .name    { animation: slideIn 0.9s ease-out calc(var(--lead) + 0.7s) both; }
  .slot.show .meta    { animation: slideIn 0.9s ease-out calc(var(--lead) + 0.9s) both; }
  .slot.show .divider { animation: growLine 1s ease-out calc(var(--lead) + 1.1s) both; }
  .slot.show .avg     { animation: slideIn 0.9s ease-out calc(var(--lead) + 1.5s) both; }
  .slot.show .avg-score { animation: shine 8s ease-in-out calc(var(--lead) + 3s) infinite; }

  .slot.female .divider { transform-origin: right center; }
  .slot.male .divider   { transform-origin: left center; }

  @keyframes portraitIn {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(calc(var(--from) * 0.8)); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes growLine {
    from { opacity: 0; transform: scaleX(0); }
    to   { opacity: 0.6; transform: scaleX(1); }
  }
  /* slow breathing glow on the gold ring */
  @keyframes ringGlow {
    0%, 100% { box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.55), 0 0 12px rgba(230, 185, 92, 0.30); }
    50%      { box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.55), 0 0 26px rgba(230, 185, 92, 0.75); }
  }
  /* a light sweep across the average every few seconds */
  @keyframes shine {
    0%, 55% { background-position: 160% 0, 0 0; }
    100%    { background-position: -60% 0, 0 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .panel { transform: none; transition: opacity 0.2s ease; }
    .judge-score.flash { animation: none; }
    .slot.show .portrait, .slot.show .id-mark, .slot.show .name, .slot.show .meta,
    .slot.show .divider, .slot.show .avg, .slot.show .avg-score { animation: none; }
  }
</style>
</head>
<body>
  <section id="slot-female" class="slot female"></section>
  <section id="slot-male" class="slot male"></section>

<script src="/socket.io/socket.io.js"></script>
<script src="overlay.js"></script>
<script>
  // Add ?preview to the URL to see the overlay over a mid-tone backdrop in a normal browser tab.
  if (/[?&]preview/.test(location.search)) {
    document.body.style.background = 'linear-gradient(135deg, #241a1f, #1c2733)';
  }
</script>
</body>
</html>
