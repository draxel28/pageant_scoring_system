<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsors Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: radial-gradient(circle at center, #141622 0%, #08090e 100%);
    --gold: #f1c40f;
    --gold-glow: rgba(241, 196, 15, 0.5);
    --text-main: #f8f9fa;
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    box-sizing: border-box;
    position: relative;
    padding: 20px;
  }

  /* Full Screen Background Media Layer */
  #bgContainer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    overflow: hidden;
  }

  #bgContainer img, #bgContainer video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Dark Overlay for readability */
  #bgOverlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7); 
    z-index: 2;
  }

  .container {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 1000px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Catchy Animated Pageant Title */
  h1 {
    font-family: 'Cinzel', serif;
    font-size: 3.5rem;
    font-weight: 800;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 6px;
    margin-top: 0;
    margin-bottom: 40px;
    text-shadow: 0 0 30px var(--gold-glow), 0 4px 15px rgba(0, 0, 0, 0.9);
    animation: titlePulse 3s ease-in-out infinite alternate;
  }

  @keyframes titlePulse {
    0% {
      transform: scale(1);
      text-shadow: 0 0 20px rgba(241, 196, 15, 0.4), 0 4px 15px rgba(0, 0, 0, 0.9);
    }
    100% {
      transform: scale(1.02);
      text-shadow: 0 0 40px rgba(241, 196, 15, 0.8), 0 4px 20px rgba(0, 0, 0, 0.9);
    }
  }

  /* Slideshow Sponsor Card Container */
  .sponsor-slideshow-wrapper {
    position: relative;
    width: 100%;
    height: 440px; /* Increased wrapper height for larger items */
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sponsor-slide {
    position: absolute;
    width: 100%;
    opacity: 0;
    transform: scale(0.95);
    transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .sponsor-slide.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* Larger Sponsor Image Styling */
  .sponsor-slide img {
    max-width: 550px;  /* Increased max-width */
    max-height: 330px; /* Increased max-height */
    width: auto;
    height: auto;
    object-fit: contain;
    margin-bottom: 20px;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
  }

  /* Sponsor Name / Label */
  .sponsor-slide p {
    font-family: 'Cinzel', serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
    text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
  }

  /* Responsive adjustment */
  @media (max-width: 900px) {
    h1 {
      font-size: 2.3rem;
    }
    .sponsor-slide img {
      max-width: 350px;
      max-height: 220px;
    }
    .sponsor-slide p {
      font-size: 1.5rem;
    }
  }
</style>
</head>
<body>

<!-- Background Video Layer -->
<div id="bgContainer">
  <video src="/sponsors/2ND BG.mp4" autoplay muted loop playsinline></video>
</div>
<div id="bgOverlay"></div>

<div class="container">
  <h1>Thanks to our Sponsors</h1>
  
  <!-- Slideshow Container -->
  <div class="sponsor-slideshow-wrapper">
    
    <!-- Slide 1 -->
    <div class="sponsor-slide active">
      <img src="/sponsors/Bambao.png" alt="Hon. Mayor Lamberto Bambao" onerror="this.style.display='none'">
      <p>Hon. Mayor Lamberto Bambao</p>
    </div>

    <!-- Slide 2 -->
    <div class="sponsor-slide">
      <img src="/sponsors/Soberano.png" alt="Hon. VM Calvin Kenneth Soberano" onerror="this.style.display='none'">
      <p>Hon. VM Calvin Kenneth Soberano</p>
    </div>

    <!-- Slide 3 -->
    <div class="sponsor-slide">
      <img src="/sponsors/Magbitang.png" alt="Hon. Mayor Rommel Magbitang" onerror="this.style.display='none'">
      <p>Hon. Mayor Rommel Magbitang</p>
    </div>

    <!-- Slide 4 -->
    <div class="sponsor-slide">
      <img src="/sponsors/UltraTech.png" alt="UltraTech Solutions" onerror="this.style.display='none'">
      <p>UltraTech Solutions</p>
    </div>

    <!-- Slide 5 -->
    <div class="sponsor-slide">
      <img src="/sponsors/AJT.jpg" alt="AJT Travel and Tours" onerror="this.style.display='none'">
      <p>AJT Travel and Tours</p>
    </div>

    <!-- Slide 6 -->
    <div class="sponsor-slide">
      <p style="color: var(--gold); font-size: 2.8rem;">Mr. Christian Avilla</p>
    </div>

  </div>
</div>

<script>
  // Automatic Slideshow Logic
  const slides = document.querySelectorAll('.sponsor-slide');
  let currentSlide = 0;

  function nextSlide() {
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
  }

  // Change slide every 4 seconds
  setInterval(nextSlide, 4000);
</script>

</body>
</html>
