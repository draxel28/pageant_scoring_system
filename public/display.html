<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pageant Results - Individual Display</title>
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --bg-gradient: radial-gradient(circle at center, #141622 0%, #08090e 100%);
    --card-bg: rgba(15, 17, 26, 0.85);
    --border-color: rgba(255, 255, 255, 0.12);
    --gold: #f1c40f;
    --gold-glow: rgba(241, 196, 15, 0.35);
    --text-main: #f8f9fa;
    --text-muted: #8c9ea6;
  }

  body {
    background: var(--bg-gradient);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    position: relative;
  }

  /* Video Background Layer Styling */
  .bg-video-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }

  body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(8, 9, 14, 0.6);
    z-index: 1;
    pointer-events: none;
  }

  .stage {
    width: 100%;
    max-width: 1400px;
    padding: 15px 20px 10px 20px;
    text-align: center;
    box-sizing: border-box;
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    justify-content: space-between;
  }

  .segTitle {
    font-size: 2.4rem;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    text-shadow: 0 4px 25px var(--gold-glow);
    margin-top: 5px;
    margin-bottom: 0px;
  }

  .waiting {
    font-size: 2rem;
    color: var(--text-muted);
    margin: auto;
    letter-spacing: 1.5px;
    font-weight: 300;
    padding: 20px;
  }

  /* Central Photo / Video Display Container */
  .central-photo-container {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    flex: 1;
    margin: 10px 0;
    position: relative;
    width: 100%;
    overflow: visible;
  }

  /* Realistic upward-beaming floor spotlights from the feet pointing up */
  .central-photo-container::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 50%;
    height: 180px;
    background: linear-gradient(to top, rgba(255, 240, 160, 0.6) 0%, rgba(241, 196, 15, 0.25) 30%, transparent 100%);
    clip-path: polygon(40% 100%, 60% 100%, 85% 0%, 15% 0%);
    filter: blur(8px);
    z-index: 1;
    pointer-events: none;
    animation: flashlightBeam 2s ease-in-out infinite alternate;
  }

  @keyframes flashlightBeam {
    0% { opacity: 0.6; transform: translateX(-50%) scale(0.96); }
    100% { opacity: 0.95; transform: translateX(-50%) scale(1.04); }
  }

  .segment-contestant-display-photo,
  .segment-contestant-display-video {
    max-height: 68vh;
    max-width: 100%;
    object-fit: contain;
    border-radius: 0;
    border: none;
    background: transparent;
    box-shadow: none;
    filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.9)) drop-shadow(0 -20px 25px rgba(255, 235, 130, 0.5)) drop-shadow(0 -5px 10px rgba(255, 255, 255, 0.4));
    margin-bottom: -10px;
    position: relative;
    z-index: 2;
  }

  .segment-contestant-photo-placeholder {
    width: 280px;
    height: 320px;
    border: 3px dashed var(--border-color);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.9rem;
    background: rgba(0, 0, 0, 0.2);
  }

  /* Bottom Banner Container Layout */
  .display-banner {
    position: relative;
    width: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: 30px;
    padding: 12px 25px;
    box-sizing: border-box;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    z-index: 3;
  }

  /* Left Section: Contestant Profile */
  .contestant-section {
    display: flex;
    align-items: center;
    gap: 15px;
    position: relative;
  }

  .contestant-large-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold);
    background: #222;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    position: absolute;
    top: -50px;
    left: 10px;
  }

  .contestant-avatar-placeholder {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid var(--gold);
    background: #1a1c29;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    position: absolute;
    top: -50px;
    left: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
  }

  .contestant-info {
    margin-left: 110px;
    text-align: left;
  }

  .contestant-name {
    font-size: 1.3rem;
    font-weight: 900;
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0;
  }

  .contestant-location {
    font-size: 0.85rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 2px;
    font-weight: 600;
  }

  /* Center Section: Judges Breakdown */
  .judges-section {
    display: flex;
    align-items: center;
    gap: 12px;
    overflow-x: auto;
    padding: 5px;
    max-width: 100%;
  }

  .judge-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 6px 8px;
    min-width: 55px;
  }

  .judge-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
    margin-bottom: 4px;
  }

  .judge-name {
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
    white-space: nowrap;
  }

  .judge-score {
    font-size: 1rem;
    font-weight: 800;
    color: #fff;
  }

  /* Right Section: Average Score / Rank */
  .average-section {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 8px 18px;
    text-align: center;
    min-width: 95px;
  }

  .average-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 2px;
    font-weight: 700;
  }

  .average-value {
    font-size: 1.7rem;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
  }

  .pulse {
    animation: pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.98); }
  }

  @media (max-width: 900px) {
    .stage {
      padding: 10px;
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
    }

    .segTitle {
      font-size: 1.8rem;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .central-photo-container {
      margin: 20px 0;
    }

    .segment-contestant-display-photo,
    .segment-contestant-display-video {
      max-height: 48vh;
      margin-bottom: 0;
    }

    .display-banner {
      flex-direction: column;
      gap: 20px;
      padding: 25px 15px 15px 15px;
      border-radius: 25px;
      margin-bottom: 10px;
    }

    .contestant-section {
      width: 100%;
      justify-content: center;
      text-align: center;
      margin-top: 25px;
    }

    .contestant-large-avatar, 
    .contestant-avatar-placeholder {
      left: 50%;
      transform: translateX(-50%);
      top: -75px;
      width: 80px;
      height: 80px;
    }

    .contestant-info {
      margin-left: 0;
      text-align: center;
    }

    .contestant-name {
      font-size: 1.2rem;
    }

    .judges-section {
      width: 100%;
      justify-content: flex-start;
      padding-bottom: 5px;
    }

    .average-section {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
    }
  }
</style>
</head>
<body>

<!-- Dynamic Background Layer Container -->
<div id="background-layer-container"></div>

<div class="stage">
  <div class="segTitle" id="segTitle">Welcome</div>
  <div id="body" style="display: flex; flex-direction: column; justify-content: center; flex: 1;">
    <div class="waiting pulse">Waiting for the segment to begin...</div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentState = null;
let currentContestantIndex = 0;

// Enhanced helper function checking extension or explicit flags
function isVideoFile(mediaObj) {
  if (!mediaObj) return false;
  const url = mediaObj.url || mediaObj;
  if (typeof url !== 'string') return false;
  
  // If backend explicitly flags it as a video or mime type contains video
  if (mediaObj.type === 'video' || (mediaObj.mimetype && mediaObj.mimetype.startsWith('video'))) {
    return true;
  }
  
  const cleanUrl = url.split('?')[0];
  const ext = cleanUrl.split('.').pop().toLowerCase();
  const videoExtensions = ['mp4', 'webm', 'ogg', 'mov', 'm4v', 'mkv', 'quicktime'];
  
  // Also check filename patterns or known video format extensions
  return videoExtensions.includes(ext) || /\.(mp4|webm|ogg|mov|m4v|mkv)(\?.*)?$/i.test(url);
}

socket.on('state-updated', (state) => {
  currentState = state;
  if (currentState.event && typeof currentState.event.activeContestantIndex === 'number') {
    currentContestantIndex = currentState.event.activeContestantIndex;
  }
  render(state);
});

socket.on('contestant-index-updated', (index) => {
  currentContestantIndex = index;
  if (currentState) {
    render(currentState);
  } else {
    refresh();
  }
});

async function refresh() {
  const res = await fetch('/api/state');
  currentState = await res.json();
  if (currentState.event && typeof currentState.event.activeContestantIndex === 'number') {
    currentContestantIndex = currentState.event.activeContestantIndex;
  }
  render(currentState);
}

function updateBackground(state) {
  const bgContainer = document.getElementById('background-layer-container');
  let bgUrl = '';

  if (state.event && state.event.backgroundUrl) {
    bgUrl = state.event.backgroundUrl;
  } else if (state.backgrounds && state.backgrounds.length > 0) {
    bgUrl = state.backgrounds[state.backgrounds.length - 1].url;
  }

  if (!bgUrl) {
    bgContainer.innerHTML = '';
    document.body.style.backgroundImage = 'var(--bg-gradient)';
    return;
  }

  // Check if background URL points to a video file
  if (isVideoFile(bgUrl)) {
    document.body.style.backgroundImage = 'none';
    // Prevent recreating the video element if it's already playing the exact same source
    const existingVideo = bgContainer.querySelector('video');
    if (!existingVideo || existingVideo.getAttribute('src') !== bgUrl) {
      bgContainer.innerHTML = `<video src="${bgUrl}" class="bg-video-layer" autoplay loop muted playsinline></video>`;
    }
  } else {
    bgContainer.innerHTML = '';
    document.body.style.backgroundImage = `url('${bgUrl}')`;
  }
}

function render(state) {
  updateBackground(state);

  const activeSegmentId = state.event && state.event.activeSegmentId;
  const segTitleEl = document.getElementById('segTitle');
  const bodyEl = document.getElementById('body');

  if (!activeSegmentId) {
    segTitleEl.textContent = state.event?.name || 'Pageant Scoring';
    bodyEl.innerHTML = `<div class="waiting pulse">Waiting for the next segment to begin...</div>`;
    return;
  }

  if (activeSegmentId === 'overall') {
    segTitleEl.textContent = '⭐ Overall Competition Leaderboard';
    bodyEl.innerHTML = `<div class="waiting">Please select an individual active segment to display single contestant breakdown.</div>`;
    return;
  }

  const segment = state.segments.find(s => s.id === activeSegmentId);
  if (!segment) {
    segTitleEl.textContent = 'Pageant Scoring';
    bodyEl.innerHTML = `<div class="waiting">Active segment not found.</div>`;
    return;
  }

  segTitleEl.textContent = segment.name;

  if (!segment.revealed) {
    bodyEl.innerHTML = `<div class="waiting pulse">Scores for <strong>${segment.name}</strong> are currently hidden. Please stand by.</div>`;
    return;
  }

  const contestants = state.contestants || [];
  if (contestants.length === 0) {
    bodyEl.innerHTML = `<div class="waiting">No contestants registered.</div>`;
    return;
  }

  if (currentContestantIndex >= contestants.length) {
    currentContestantIndex = 0;
  }

  const contestant = contestants[currentContestantIndex];
  const judges = state.judges || [];
  const segScores = state.scores[segment.id] || {};
  
  const contestantResult = segment.results ? segment.results.find(r => r.contestantId === contestant.id) : null;
  const averageScore = contestantResult && contestantResult.average !== null ? contestantResult.average.toFixed(2) : '—';

  let avatarHtml = `<div class="contestant-avatar-placeholder">No Photo</div>`;
  if (contestant.photo) {
    avatarHtml = `<img src="${contestant.photo}" class="contestant-large-avatar" alt="${contestant.name}">`;
  }

  const segmentPhotos = state.segmentPhotos || [];
  const activeSegmentPhoto = segmentPhotos.expressFind ? null : segmentPhotos.find(
    p => p.segmentId === segment.id && p.contestantId === contestant.id
  );

  let centralPhotoHtml = `<div class="segment-contestant-photo-placeholder">No Segment Media Uploaded</div>`;
  if (activeSegmentPhoto && activeSegmentPhoto.url) {
    // Pass the whole object so type checking works even if extension is saved as .png
    if (isVideoFile(activeSegmentPhoto)) {
      centralPhotoHtml = `<video src="${activeSegmentPhoto.url}" class="segment-contestant-display-video" autoplay loop muted playsinline></video>`;
    } else {
      centralPhotoHtml = `<img src="${activeSegmentPhoto.url}" class="segment-contestant-display-photo" alt="${contestant.name}" onerror="this.onerror=null; this.outerHTML='<video src=\'${activeSegmentPhoto.url}\' class=\'segment-contestant-display-video\' autoplay loop muted playsinline></video>';">`;
    }
  }

  let judgesHtml = '';
  if (judges.length === 0) {
    judgesHtml = `<span style="color: var(--text-muted); font-size: 0.9rem;">No judges added yet.</span>`;
  } else {
    judges.forEach((j) => {
      const judgeScores = segScores[j.id] && segScores[j.id][contestant.id];
      let scoreDisplay = '—';
      if (judgeScores) {
        let total = 0;
        segment.criteria.forEach(cr => {
          total += Number(judgeScores[cr.id]) || 0;
        });
        scoreDisplay = total.toFixed(2);
      }

      const sampleJudgePhoto = `https://picsum.photos/seed/judge${j.id}/100/100`;

      judgesHtml += `
        <div class="judge-card">
          <img src="${sampleJudgePhoto}" class="judge-avatar" alt="${j.name}">
          <span class="judge-name">${j.name}</span>
          <span class="judge-score">${scoreDisplay}</span>
        </div>
      `;
    });
  }

  bodyEl.innerHTML = `
    <div style="display: flex; flex-direction: column; justify-content: space-between; align-items: center; flex: 1; width: 100%;">
      
      <!-- Middle Screen: Segment Contestant Media Display with Upward Flashlight Floor Beams -->
      <div class="central-photo-container">
        ${centralPhotoHtml}
      </div>

      <!-- Bottom Banner -->
      <div class="display-banner">
        <!-- Left: Contestant Profile -->
        <div class="contestant-section">
          ${avatarHtml}
          <div class="contestant-info">
            <h2 class="contestant-name">${contestant.number ? `#${contestant.number} ` : ''}${contestant.name}</h2>
            <div class="contestant-location">${contestant.barangay || 'Contestant'}</div>
          </div>
        </div>

        <!-- Center: Judges List & Scores -->
        <div class="judges-section">
          ${judgesHtml}
        </div>

        <!-- Right: Average Score -->
        <div class="average-section">
          <div class="average-label">Average Score</div>
          <div class="average-value">${averageScore}</div>
        </div>
      </div>
    </div>
  `;
}

refresh();
</script>
</body>
</html>
