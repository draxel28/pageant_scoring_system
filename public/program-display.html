<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Program</title>
<style>
  :root { --gold: #c9a24a; --gold-light: #e6c877; --bg: #0f1013; --text: #f3f1ea; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #211c10 0%, var(--bg) 65%);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
    cursor: none;
  }

  /* optional background image / video picked in the admin page */
  #bg { position: fixed; inset: 0; z-index: 0; }
  #bg img, #bg video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #bg::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45); }
  #bg:empty::after { display: none; }

  #stage {
    position: relative; z-index: 1;
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 6vh 8vw;
  }
  .reveal { animation: reveal 0.9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(2vh) scale(.98); } to { opacity: 1; transform: none; } }

  .pic {
    display: block; margin: 0 auto 3vh;
    max-width: 50vw; max-height: 30vh; object-fit: contain;
    border-radius: 14px; border: 3px solid var(--gold);
    box-shadow: 0 0 40px rgba(201, 162, 74, 0.25);
  }
  .title {
    margin: 0; font-weight: 700; line-height: 1.05;
    font-size: clamp(2rem, 5vw, 5rem);
    overflow-wrap: anywhere;
    color: var(--gold-light);
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.6);
  }
  .rule { width: min(300px, 30vw); height: 2px; margin: 3vh auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .detail {
    margin: 0; font-style: italic; font-weight: 400;
    font-size: clamp(1.1rem, 2.2vw, 2.2rem);
    overflow-wrap: anywhere;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
  }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
</style>
</head>
<body>
<div id="bg"></div>
<div id="stage"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io({ query: { role: 'display' } });
  const bgEl = document.getElementById('bg');
  const stage = document.getElementById('stage');
  let lastBg = null;
  let lastItem = null;

  const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const isVideo = u => ['mp4', 'webm', 'ogg', 'mov'].includes(String(u || '').split('?')[0].split('.').pop().toLowerCase());

  function render(d) {
    // Background is redrawn only when it changes, so a looping video doesn't restart on every update.
    const url = d.background ? d.background.url : '';
    if (url !== lastBg) {
      lastBg = url;
      bgEl.innerHTML = !url ? '' : isVideo(url)
        ? `<video src="${esc(url)}" autoplay muted loop playsinline></video>`
        : `<img src="${esc(url)}" alt="">`;
    }

    const sig = d.current ? JSON.stringify(d.current) : '';
    if (sig !== lastItem) {
      lastItem = sig;
      stage.innerHTML = d.current ? `<div class="reveal">
        ${d.current.image ? `<img class="pic" src="${esc(d.current.image)}" alt="">` : ''}
        <h1 class="title">${esc(d.current.title)}</h1>
        ${d.current.detail ? `<div class="rule"></div><p class="detail">${esc(d.current.detail)}</p>` : ''}
      </div>` : '';
    }
  }

  async function load() {
    try { render(await (await fetch('/api/program')).json()); } catch (e) { /* server offline: keep last screen */ }
  }

  socket.on('program-updated', render);
  socket.on('connect', load);
  load();
  setInterval(load, 5000); // safety net if a socket event is missed
</script>
</body>
</html>
